<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar - PadelYa</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="barra" class="barra"></header>

  <main class="contenedor contenedor-chico">
    <section class="tarjeta">
      <h1>Iniciar sesión</h1>

      <!-- acá aparece el error si el email o la contraseña están mal -->
      <div id="mensaje" class="mensaje"></div>

      <form id="form-login" class="formulario">
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Ingresar</button>
      </form>

      <p class="ayuda">¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
      <!-- <p class="ayuda">Usuario de prueba: jugador@padelya.com / 123456</p> -->
    </section>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="js/utils.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pantallas/login.js"></script>
</body>
</html>
