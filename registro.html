<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarme - PadelYa</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="barra" class="barra"></header>

  <main class="contenedor contenedor-chico">
    <section class="tarjeta">
      <h1>Crear cuenta</h1>

      <!-- acá aparecen los errores (email repetido, contraseña corta, etc) -->
      <div id="mensaje" class="mensaje"></div>

      <form id="form-registro" class="formulario">
        <div class="campo">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required autocomplete="name">
        </div>
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="campo">
          <label for="password">Contraseña (mínimo 6 caracteres)</label>
          <input type="password" id="password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn">Registrarme</button>
      </form>

      <p class="ayuda">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
    </section>
  </main>

  <footer id="pie" class="pie"></footer>

  <script src="js/utils.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pantallas/registro.js"></script>
</body>
</html>
